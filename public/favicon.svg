<svg viewBox="0 0 512 512" width="512" height="512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Simplified shell — high contrast for small sizes -->
    <linearGradient id="fav-shell" x1="25%" y1="0%" x2="75%" y2="100%">
      <stop offset="0%"   stop-color="#3D4555" />
      <stop offset="55%"  stop-color="#252B38" />
      <stop offset="100%" stop-color="#161A22" />
    </linearGradient>

    <!-- Top gloss to distinguish shell edge at small sizes -->
    <linearGradient id="fav-gloss" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#6A7A90" stop-opacity="0.65" />
      <stop offset="50%"  stop-color="#3D4555" stop-opacity="0" />
    </linearGradient>

    <!-- Groove floor — darkened inner channel -->
    <linearGradient id="fav-groove" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"  stop-color="#080B10" />
      <stop offset="100%" stop-color="#0E1218" />
    </linearGradient>

    <!-- High-contrast neon wave for tiny favicon readability -->
    <linearGradient id="fav-neon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#5865F2" />
      <stop offset="50%"  stop-color="#00DEFF" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <!-- Clip to organic shape -->
    <clipPath id="fav-clip">
      <path d="
        M 72 256
        C 72 178, 102 132, 142 120
        C 160 114, 172 110, 186 118
        C 196 123, 203 133, 212 131
        C 220 129, 228 114, 238 110
        C 248 106, 257 104, 268 108
        C 278 112, 285 126, 293 127
        C 301 128, 309 121, 320 117
        C 332 111, 346 113, 364 122
        C 402 138, 440 182, 440 256
        C 440 330, 402 374, 364 390
        C 346 399, 332 401, 320 395
        C 309 391, 301 384, 293 385
        C 285 386, 278 400, 268 404
        C 257 408, 248 406, 238 402
        C 228 398, 220 383, 212 381
        C 203 379, 196 389, 186 394
        C 172 402, 160 398, 142 392
        C 102 380, 72 334, 72 256 Z
      " />
    </clipPath>
  </defs>

  <!-- Outer Shell — single simplified path for crisp favicon render -->
  <path d="
    M 72 256
    C 72 178, 102 132, 142 120
    C 160 114, 172 110, 186 118
    C 196 123, 203 133, 212 131
    C 220 129, 228 114, 238 110
    C 248 106, 257 104, 268 108
    C 278 112, 285 126, 293 127
    C 301 128, 309 121, 320 117
    C 332 111, 346 113, 364 122
    C 402 138, 440 182, 440 256
    C 440 330, 402 374, 364 390
    C 346 399, 332 401, 320 395
    C 309 391, 301 384, 293 385
    C 285 386, 278 400, 268 404
    C 257 408, 248 406, 238 402
    C 228 398, 220 383, 212 381
    C 203 379, 196 389, 186 394
    C 172 402, 160 398, 142 392
    C 102 380, 72 334, 72 256 Z
  "
    fill="url(#fav-shell)"
  />

  <!-- Top gloss overlay — helps readability at small sizes -->
  <path d="
    M 72 256
    C 72 178, 102 132, 142 120
    C 160 114, 172 110, 186 118
    C 196 123, 203 133, 212 131
    C 220 129, 228 114, 238 110
    C 248 106, 257 104, 268 108
    C 278 112, 285 126, 293 127
    C 301 128, 309 121, 320 117
    C 332 111, 346 113, 364 122
    C 402 138, 440 182, 440 256 L 72 256 Z
  "
    fill="url(#fav-gloss)"
  />

  <!-- Inner Groove — dark channel -->
  <path d="
    M 108 256
    C 108 202, 130 166, 160 156
    C 171 152, 181 152, 193 158
    C 202 163, 208 172, 215 171
    C 222 170, 230 158, 241 155
    C 249 152, 257 151, 265 154
    C 273 157, 281 168, 288 169
    C 296 170, 304 162, 315 157
    C 326 152, 338 152, 350 158
    C 378 170, 404 202, 404 256
    C 404 310, 378 342, 350 354
    C 338 360, 326 360, 315 355
    C 304 350, 296 342, 288 343
    C 281 344, 273 355, 265 358
    C 257 361, 249 360, 241 357
    C 230 354, 222 342, 215 341
    C 208 340, 202 349, 193 354
    C 181 360, 171 360, 160 356
    C 130 346, 108 310, 108 256 Z
  "
    fill="url(#fav-groove)"
  />

  <!-- Neon wave — thicker stroke for favicon visibility, no extra pink layer -->
  <!-- Wide glow halo -->
  <path
    d="M 122 256 C 156 170, 200 170, 226 256 C 252 342, 296 342, 322 256 C 346 194, 374 194, 390 256"
    fill="none"
    stroke="url(#fav-neon)"
    stroke-width="44"
    stroke-linecap="round"
    stroke-linejoin="round"
    opacity="0.30"
    clip-path="url(#fav-clip)"
  />

  <!-- Core tube -->
  <path
    d="M 122 256 C 156 170, 200 170, 226 256 C 252 342, 296 342, 322 256 C 346 194, 374 194, 390 256"
    fill="none"
    stroke="url(#fav-neon)"
    stroke-width="22"
    stroke-linecap="round"
    stroke-linejoin="round"
    clip-path="url(#fav-clip)"
  />

  <!-- Bright core centerline (white-ish for contrast at 16px) -->
  <path
    d="M 122 256 C 156 170, 200 170, 226 256 C 252 342, 296 342, 322 256 C 346 194, 374 194, 390 256"
    fill="none"
    stroke="#D0F4FF"
    stroke-width="7"
    stroke-linecap="round"
    stroke-linejoin="round"
    opacity="0.80"
    clip-path="url(#fav-clip)"
  />
</svg>
