<svg viewBox="0 0 1200 630" width="1200" height="630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="og-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090214" />
      <stop offset="45%" stop-color="#140628" />
      <stop offset="85%" stop-color="#1A0A33" />
      <stop offset="100%" stop-color="#0F031E" />
    </linearGradient>

    <!-- Radial Auras -->
    <radialGradient id="og-glow-pink" cx="20%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF2D78" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#8B14CC" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="og-glow-cyan" cx="85%" cy="30%" r="45%">
      <stop offset="0%" stop-color="#00EEFF" stop-opacity="0.25" />
      <stop offset="65%" stop-color="#0055FF" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Text Gradients -->
    <linearGradient id="og-text-title" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#FFE0F0" />
      <stop offset="100%" stop-color="#FF96C8" />
    </linearGradient>

    <linearGradient id="og-badge-border" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF2D78" />
      <stop offset="100%" stop-color="#00F7FF" />
    </linearGradient>

    <!-- Embedded Synthwave Lossless Icon Gradients -->
    <linearGradient id="og-icon-bg" x1="112" y1="88" x2="608" y2="632" gradientUnits="userSpaceOnUse">
      <stop stop-color="#12062C" />
      <stop offset="0.52" stop-color="#231052" />
      <stop offset="1" stop-color="#09031B" />
    </linearGradient>

    <mask id="og-icon-mask" style="mask-type:luminance" maskUnits="userSpaceOnUse" x="70" y="58" width="580" height="580">
      <path d="M510 58H210C132.68 58 70 120.68 70 198V498C70 575.32 132.68 638 210 638H510C587.32 638 650 575.32 650 498V198C650 120.68 587.32 58 510 58Z" fill="white" />
    </mask>

    <linearGradient id="og-icon-sun" x1="485" y1="122" x2="485" y2="292" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFD15A" />
      <stop offset="0.45" stop-color="#FF6F91" />
      <stop offset="1" stop-color="#D83BFF" />
    </linearGradient>

    <linearGradient id="og-icon-beam" x1="220" y1="178" x2="544" y2="512" gradientUnits="userSpaceOnUse">
      <stop stop-color="#00F5FF" />
      <stop offset="0.42" stop-color="#6C5CFF" />
      <stop offset="0.73" stop-color="#E43CFF" />
      <stop offset="1" stop-color="#FF427F" />
    </linearGradient>

    <linearGradient id="og-icon-head-left" x1="131.905" y1="207.791" x2="543.259" y2="425.323" gradientUnits="userSpaceOnUse">
      <stop stop-color="#00F5FF" />
      <stop offset="0.42" stop-color="#6C5CFF" />
      <stop offset="0.73" stop-color="#E43CFF" />
      <stop offset="1" stop-color="#FF427F" />
    </linearGradient>

    <linearGradient id="og-icon-head-right" x1="155.306" y1="265.538" x2="566.66" y2="483.07" gradientUnits="userSpaceOnUse">
      <stop stop-color="#00F5FF" />
      <stop offset="0.42" stop-color="#6C5CFF" />
      <stop offset="0.73" stop-color="#E43CFF" />
      <stop offset="1" stop-color="#FF427F" />
    </linearGradient>

    <linearGradient id="og-icon-shield" x1="170" y1="390" x2="360" y2="584" gradientUnits="userSpaceOnUse">
      <stop stop-color="#00F5FF" />
      <stop offset="0.48" stop-color="#7657FF" />
      <stop offset="1" stop-color="#FF3DA5" />
    </linearGradient>

    <!-- Icon Soft Drop Shadow -->
    <filter id="og-icon-shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.65" />
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#8B14CC" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="630" fill="url(#og-bg)" />

  <!-- Atmospheric Glow Overlays -->
  <rect width="1200" height="630" fill="url(#og-glow-pink)" />
  <rect width="1200" height="630" fill="url(#og-glow-cyan)" />

  <!-- Retro Synthwave Horizon Perspective Grid -->
  <g opacity="0.4">
    <!-- Horizontal Perspective Lines -->
    <line x1="0" y1="630" x2="1200" y2="630" stroke="#FF2D78" stroke-width="2" />
    <line x1="0" y1="580" x2="1200" y2="580" stroke="#E02280" stroke-width="1.6" />
    <line x1="0" y1="538" x2="1200" y2="538" stroke="#B81CA0" stroke-width="1.3" />
    <line x1="0" y1="504" x2="1200" y2="504" stroke="#9014C0" stroke-width="1" />
    <line x1="0" y1="478" x2="1200" y2="478" stroke="#7512B8" stroke-width="0.8" />
    <line x1="0" y1="458" x2="1200" y2="458" stroke="#5C0D9E" stroke-width="0.6" />
    <line x1="0" y1="442" x2="1200" y2="442" stroke="#480A84" stroke-width="0.5" />

    <!-- Vanishing Perspective Beams converging at horizon (600, 420) -->
    <line x1="600" y1="420" x2="0" y2="630" stroke="#8B14CC" stroke-width="1" />
    <line x1="600" y1="420" x2="160" y2="630" stroke="#8B14CC" stroke-width="1" />
    <line x1="600" y1="420" x2="340" y2="630" stroke="#8B14CC" stroke-width="1" />
    <line x1="600" y1="420" x2="520" y2="630" stroke="#8B14CC" stroke-width="1" />
    <line x1="600" y1="420" x2="680" y2="630" stroke="#8B14CC" stroke-width="1" />
    <line x1="600" y1="420" x2="860" y2="630" stroke="#8B14CC" stroke-width="1" />
    <line x1="600" y1="420" x2="1040" y2="630" stroke="#8B14CC" stroke-width="1" />
    <line x1="600" y1="420" x2="1200" y2="630" stroke="#8B14CC" stroke-width="1" />
  </g>

  <!-- Left: Synthwave Lossless Checker Icon (scaled to ~374px, centered vertically at x=70, y=128) -->
  <g transform="translate(70, 128) scale(0.52)" filter="url(#og-icon-shadow)">
    <!-- Base Squircle Background -->
    <path
      d="M510 58H210C132.68 58 70 120.68 70 198V498C70 575.32 132.68 638 210 638H510C587.32 638 650 575.32 650 498V198C650 120.68 587.32 58 510 58Z"
      fill="url(#og-icon-bg)"
    />

    <!-- Masked Horizon Grid & Sun -->
    <g mask="url(#og-icon-mask)">
      <g opacity="0.42">
        <path
          d="M500 284C550.81 284 592 242.81 592 192C592 141.19 550.81 100 500 100C449.19 100 408 141.19 408 192C408 242.81 449.19 284 500 284Z"
          fill="url(#og-icon-sun)"
        />
        <path
          d="M82 495H638M96 530H624M116 564H604M144 596H576"
          stroke="#B342FF"
          stroke-width="4"
        />
        <path
          d="M526 638L357 444L222 638M357 444L280 638M357 444L334 638M357 444L392 638M357 444L454 638"
          stroke="#2FE8FF"
          stroke-width="3"
        />
      </g>
    </g>

    <!-- Beamed Dual Note Waveform -->
    <path
      d="M321 230L515 182V410"
      stroke="url(#og-icon-beam)"
      stroke-width="54"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <path
      d="M321 230V455"
      stroke="url(#og-icon-beam)"
      stroke-width="54"
      stroke-linecap="round"
    />
    <path
      d="M289.159 529.966C330.129 516.654 354.764 479.462 344.182 446.897C333.601 414.331 291.811 398.723 250.841 412.034C209.871 425.346 185.236 462.538 195.818 495.103C206.399 527.669 248.189 543.277 289.159 529.966Z"
      fill="url(#og-icon-head-left)"
    />
    <path
      d="M483.159 484.966C524.129 471.654 548.764 434.462 538.182 401.897C527.601 369.331 485.811 353.723 444.841 367.034C403.871 380.346 379.236 417.538 389.818 450.103C400.399 482.669 442.189 498.277 483.159 484.966Z"
      fill="url(#og-icon-head-right)"
    />
    <path
      d="M322 230L514 183"
      stroke="#B8FBFF"
      stroke-opacity="0.72"
      stroke-width="12"
      stroke-linecap="round"
    />

    <!-- Lossless Quality Badge -->
    <path
      d="M236 589C292.885 589 339 542.885 339 486C339 429.115 292.885 383 236 383C179.115 383 133 429.115 133 486C133 542.885 179.115 589 236 589Z"
      fill="url(#og-icon-shield)"
      stroke="#16082F"
      stroke-width="18"
    />
    <path
      d="M236 559C276.317 559 309 526.317 309 486C309 445.683 276.317 413 236 413C195.683 413 163 445.683 163 486C163 526.317 195.683 559 236 559Z"
      fill="#13072D"
      fill-opacity="0.9"
    />
    <path
      d="M194 486L224 516L282 452"
      stroke="white"
      stroke-width="24"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- Sparkles -->
    <circle cx="548" cy="342" r="9" fill="#00F5FF" />
    <circle cx="575" cy="318" r="6" fill="#FF62C5" />
  </g>

  <!-- Right: Branding & Typography -->
  <g transform="translate(480, 160)">
    <!-- Category Pill Badge -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="230" height="36" rx="18" fill="#FF2D78" fill-opacity="0.15" stroke="url(#og-badge-border)" stroke-width="1.5" />
      <circle cx="20" cy="18" r="5" fill="#00F7FF" />
      <text x="34" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#00F7FF" letter-spacing="1.5">AUDIO WORKSPACE</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="96" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Outfit', sans-serif" font-size="56" font-weight="900" fill="url(#og-text-title)" letter-spacing="-1">Stark Synthwave</text>

    <!-- Tagline -->
    <text x="0" y="146" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="400" fill="#D0B8E8">
      Bộ công cụ phân tích &amp; xử lý âm thanh trực tuyến chuẩn xác
    </text>

    <!-- Feature Badges -->
    <g transform="translate(0, 195)">
      <!-- Feature 1: Lossless Checker -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="168" height="42" rx="21" fill="#1B0E33" stroke="#8B14CC" stroke-width="1.2" />
        <text x="20" y="26" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="600" fill="#FF8EC7">⚡ Lossless Check</text>
      </g>

      <!-- Feature 2: BPM Analyzer -->
      <g transform="translate(180, 0)">
        <rect x="0" y="0" width="158" height="42" rx="21" fill="#1B0E33" stroke="#8B14CC" stroke-width="1.2" />
        <text x="20" y="26" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="600" fill="#00F7FF">🥁 BPM &amp; Tempo</text>
      </g>

      <!-- Feature 3: Key Detection -->
      <g transform="translate(350, 0)">
        <rect x="0" y="0" width="166" height="42" rx="21" fill="#1B0E33" stroke="#8B14CC" stroke-width="1.2" />
        <text x="20" y="26" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="600" fill="#FFC837">🎵 Dò Tone Nhạc</text>
      </g>

      <!-- Feature 4: Waveform Cutter -->
      <g transform="translate(528, 0)">
        <rect x="0" y="0" width="138" height="42" rx="21" fill="#1B0E33" stroke="#8B14CC" stroke-width="1.2" />
        <text x="20" y="26" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="600" fill="#38EF7D">✂️ Cắt Audio</text>
      </g>
    </g>

    <!-- Bottom Tech Spec Note -->
    <g transform="translate(0, 275)">
      <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="500" fill="#886EAA">
        Client-side Web Audio API • 100% riêng tư &amp; an toàn • Không tải nhạc lên server
      </text>
    </g>
  </g>
</svg>
