<svg viewBox="0 0 1200 630" width="1200" height="630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="og-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090214" />
      <stop offset="45%" stop-color="#140628" />
      <stop offset="85%" stop-color="#1A0A33" />
      <stop offset="100%" stop-color="#0F031E" />
    </linearGradient>

    <!-- Synthwave Horizon Grid Mask -->
    <linearGradient id="og-grid-fade" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#FF2D78" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#8B14CC" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </linearGradient>

    <!-- Radial Auras -->
    <radialGradient id="og-glow-pink" cx="20%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF2D78" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#8B14CC" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="og-glow-cyan" cx="85%" cy="30%" r="45%">
      <stop offset="0%" stop-color="#00EEFF" stop-opacity="0.25" />
      <stop offset="65%" stop-color="#0055FF" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Text Gradients -->
    <linearGradient id="og-text-title" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#FFE0F0" />
      <stop offset="100%" stop-color="#FF96C8" />
    </linearGradient>

    <linearGradient id="og-badge-border" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF2D78" />
      <stop offset="100%" stop-color="#00F7FF" />
    </linearGradient>

    <!-- Embedded Icon Gradients — Dark Graphite + Neon Indigo/Cyan -->
    <linearGradient id="og-icon-shell" x1="30%" y1="0%" x2="70%" y2="100%">
      <stop offset="0%"   stop-color="#3A4150" />
      <stop offset="50%"  stop-color="#252B38" />
      <stop offset="100%" stop-color="#141820" />
    </linearGradient>

    <linearGradient id="og-icon-groove" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#080B10" />
      <stop offset="100%" stop-color="#0D1119" />
    </linearGradient>

    <linearGradient id="og-icon-neon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#5865F2" />
      <stop offset="45%"  stop-color="#0EA5E9" />
      <stop offset="80%"  stop-color="#00DEFF" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <clipPath id="og-icon-clip">
      <path d="
        M 68 256
        C 68 176, 100 130, 140 118
        C 158 112, 170 108, 185 115
        C 195 120, 202 130, 210 128
        C 218 126, 226 112, 236 108
        C 246 104, 256 102, 266 106
        C 276 110, 284 124, 292 126
        C 300 128, 308 120, 318 116
        C 330 110, 345 112, 362 120
        C 400 136, 444 180, 444 256
        C 444 332, 400 376, 362 392
        C 345 400, 330 402, 318 396
        C 308 392, 300 384, 292 386
        C 284 388, 276 402, 266 406
        C 256 410, 246 408, 236 404
        C 226 400, 218 386, 210 384
        C 202 382, 195 392, 185 397
        C 170 404, 158 400, 140 394
        C 100 382, 68 336, 68 256 Z
      " />
    </clipPath>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="630" fill="url(#og-bg)" />

  <!-- Atmospheric Glow Overlays -->
  <rect width="1200" height="630" fill="url(#og-glow-pink)" />
  <rect width="1200" height="630" fill="url(#og-glow-cyan)" />

  <!-- Retro Synthwave Horizon Perspective Grid -->
  <g opacity="0.4">
    <!-- Horizontal Perspective Lines -->
    <line x1="0" y1="630" x2="1200" y2="630" stroke="#FF2D78" stroke-width="2" />
    <line x1="0" y1="580" x2="1200" y2="580" stroke="#E02280" stroke-width="1.6" />
    <line x1="0" y1="538" x2="1200" y2="538" stroke="#B81CA0" stroke-width="1.3" />
    <line x1="0" y1="504" x2="1200" y2="504" stroke="#9014C0" stroke-width="1" />
    <line x1="0" y1="478" x2="1200" y2="478" stroke="#7512B8" stroke-width="0.8" />
    <line x1="0" y1="458" x2="1200" y2="458" stroke="#5C0D9E" stroke-width="0.6" />
    <line x1="0" y1="442" x2="1200" y2="442" stroke="#480A84" stroke-width="0.5" />

    <!-- Vanishing Perspective Beams converging at horizon (600, 420) -->
    <line x1="600" y1="420" x2="0" y2="630" stroke="#8B14CC" stroke-width="1" />
    <line x1="600" y1="420" x2="160" y2="630" stroke="#8B14CC" stroke-width="1" />
    <line x1="600" y1="420" x2="340" y2="630" stroke="#8B14CC" stroke-width="1" />
    <line x1="600" y1="420" x2="520" y2="630" stroke="#8B14CC" stroke-width="1" />
    <line x1="600" y1="420" x2="680" y2="630" stroke="#8B14CC" stroke-width="1" />
    <line x1="600" y1="420" x2="860" y2="630" stroke="#8B14CC" stroke-width="1" />
    <line x1="600" y1="420" x2="1040" y2="630" stroke="#8B14CC" stroke-width="1" />
    <line x1="600" y1="420" x2="1200" y2="630" stroke="#8B14CC" stroke-width="1" />
  </g>

  <!-- Left: Claymorphic 3D Soundwave Icon (scaled to ~300px at x=100, y=150) -->
  <g transform="translate(100, 150) scale(0.585)">
    <!-- Icon contact shadow -->
    <ellipse cx="256" cy="460" rx="165" ry="26" fill="#000307" opacity="0.5" />

    <!-- Outer Shell — Organic Acoustic Waveform Silhouette -->
    <path d="M 68 256 C 68 176, 100 130, 140 118 C 158 112, 170 108, 185 115 C 195 120, 202 130, 210 128 C 218 126, 226 112, 236 108 C 246 104, 256 102, 266 106 C 276 110, 284 124, 292 126 C 300 128, 308 120, 318 116 C 330 110, 345 112, 362 120 C 400 136, 444 180, 444 256 C 444 332, 400 376, 362 392 C 345 400, 330 402, 318 396 C 308 392, 300 384, 292 386 C 284 388, 276 402, 266 406 C 256 410, 246 408, 236 404 C 226 400, 218 386, 210 384 C 202 382, 195 392, 185 397 C 170 404, 158 400, 140 394 C 100 382, 68 336, 68 256 Z"
      fill="url(#og-icon-shell)" />

    <!-- Top specular sheen -->
    <path d="M 68 256 C 68 176, 100 130, 140 118 C 158 112, 170 108, 185 115 C 195 120, 202 130, 210 128 C 218 126, 226 112, 236 108 C 246 104, 256 102, 266 106 C 276 110, 284 124, 292 126 C 300 128, 308 120, 318 116 C 330 110, 345 112, 362 120 C 400 136, 444 180, 444 256 L 68 256 Z"
      fill="#6B7A90" opacity="0.35" />

    <!-- Inner Recessed Groove -->
    <path d="M 100 256 C 100 196, 124 157, 155 146 C 167 142, 178 141, 190 148 C 200 154, 206 165, 213 164 C 220 163, 229 150, 240 147 C 248 144, 256 143, 264 146 C 272 149, 281 162, 288 163 C 295 164, 302 155, 313 150 C 324 144, 337 143, 350 149 C 380 162, 412 198, 412 256 C 412 314, 380 350, 350 363 C 337 369, 324 368, 313 362 C 302 357, 295 348, 288 349 C 281 350, 272 363, 264 366 C 256 369, 248 368, 240 365 C 229 362, 220 349, 213 348 C 206 347, 200 358, 190 364 C 178 371, 167 370, 155 366 C 124 355, 100 316, 100 256 Z"
      fill="url(#og-icon-groove)" />

    <!-- Neon Waveform Tube — wide glow -->
    <path d="M 116 256 C 150 166, 196 166, 222 256 C 248 346, 294 346, 328 256 C 352 196, 380 196, 396 256"
      fill="none" stroke="url(#og-icon-neon)" stroke-width="44" stroke-linecap="round" opacity="0.3" clip-path="url(#og-icon-clip)" />
    <!-- Core tube -->
    <path d="M 116 256 C 150 166, 196 166, 222 256 C 248 346, 294 346, 328 256 C 352 196, 380 196, 396 256"
      fill="none" stroke="url(#og-icon-neon)" stroke-width="20" stroke-linecap="round" clip-path="url(#og-icon-clip)" />
    <!-- Center highlight -->  
    <path d="M 116 256 C 150 166, 196 166, 222 256 C 248 346, 294 346, 328 256 C 352 196, 380 196, 396 256"
      fill="none" stroke="#D0F4FF" stroke-width="7" stroke-linecap="round" opacity="0.7" clip-path="url(#og-icon-clip)" />
  </g>

  <!-- Right: Branding & Typography -->
  <g transform="translate(480, 160)">
    <!-- Category Pill Badge -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="230" height="36" rx="18" fill="#FF2D78" fill-opacity="0.15" stroke="url(#og-badge-border)" stroke-width="1.5" />
      <circle cx="20" cy="18" r="5" fill="#00F7FF" />
      <text x="34" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#00F7FF" letter-spacing="1.5">AUDIO WORKSPACE</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="96" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Outfit', sans-serif" font-size="56" font-weight="900" fill="url(#og-text-title)" letter-spacing="-1">Stark Synthwave</text>

    <!-- Tagline -->
    <text x="0" y="146" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="400" fill="#D0B8E8">
      Bộ công cụ phân tích &amp; xử lý âm thanh trực tuyến chuẩn xác
    </text>

    <!-- Feature Feature Badges -->
    <g transform="translate(0, 195)">
      <!-- Feature 1: Lossless Checker -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="168" height="42" rx="21" fill="#1B0E33" stroke="#8B14CC" stroke-width="1.2" />
        <text x="20" y="26" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="600" fill="#FF8EC7">⚡ Lossless Check</text>
      </g>

      <!-- Feature 2: BPM Analyzer -->
      <g transform="translate(180, 0)">
        <rect x="0" y="0" width="158" height="42" rx="21" fill="#1B0E33" stroke="#8B14CC" stroke-width="1.2" />
        <text x="20" y="26" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="600" fill="#00F7FF">🥁 BPM &amp; Tempo</text>
      </g>

      <!-- Feature 3: Key Detection -->
      <g transform="translate(350, 0)">
        <rect x="0" y="0" width="166" height="42" rx="21" fill="#1B0E33" stroke="#8B14CC" stroke-width="1.2" />
        <text x="20" y="26" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="600" fill="#FFC837">🎵 Dò Tone Nhạc</text>
      </g>

      <!-- Feature 4: Waveform Cutter -->
      <g transform="translate(528, 0)">
        <rect x="0" y="0" width="138" height="42" rx="21" fill="#1B0E33" stroke="#8B14CC" stroke-width="1.2" />
        <text x="20" y="26" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="600" fill="#38EF7D">✂️ Cắt Audio</text>
      </g>
    </g>

    <!-- Bottom Tech Spec Note -->
    <g transform="translate(0, 275)">
      <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="500" fill="#886EAA">
        Client-side Web Audio API • 100% riêng tư &amp; an toàn • Không tải nhạc lên server
      </text>
    </g>
  </g>
</svg>
