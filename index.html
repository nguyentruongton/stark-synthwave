<!doctype html>

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- Single Page Apps for GitHub Pages redirect decode -->
  <script type="text/javascript">
    (((l) => {
      if (l.search[1] === '/') {
        const decoded = l.search.slice(1).split('&').map((s) => s.replace(/~and~/g, '&')).join('?');
        window.history.replaceState(null, null,
          l.pathname.slice(0, -1) + decoded + l.hash
        );
      }
    })(window.location));
  </script>
  <title>Stark Synthwave</title>
  <meta name="description"
    content="Stark Synthwave là bộ công cụ xử lý âm thanh trực tuyến mạnh mẽ giúp bạn cắt ghép nhạc, kiểm tra chất lượng nhạc Lossless, đo tốc độ BPM (Tempo) và dò tìm tone nhạc chính xác." />
